name: RESPawn Vinted Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vinted-monitor
  cancel-in-progress: false

jobs:
  check-vinted:
    runs-on: ubuntu-latest

    steps:
      - name: Download files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests beautifulsoup4

      - name: Scan Vinted
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python sniper.py

      - name: Save listing history
        run: |
          git config user.name "RESPawn Game Sniper"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Vinted listing history"
            git push
          fi
